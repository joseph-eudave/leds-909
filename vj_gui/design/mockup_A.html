<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>909 VJ — Concept A: CONSOLE</title>
<style>
:root{--bg:#0b0d10;--panel:#14181d;--panel2:#1a2027;--line:#262e37;--txt:#cfd8e3;--dim:#7a8794;
--acc:#39d98a;--prog:#e8b13c;--prev:#4aa3e8;--danger:#e8503c;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif}
body{background:var(--bg);color:var(--txt);height:100vh;display:flex;flex-direction:column;overflow:hidden;font-size:13px}
/* top master bar */
.master{height:52px;background:linear-gradient(180deg,#181d24,#10141a);border-bottom:1px solid var(--line);
display:flex;align-items:center;gap:14px;padding:0 14px}
.logo{font-weight:800;letter-spacing:2px;color:var(--acc)}
.mbtn{padding:8px 16px;border:none;border-radius:6px;font-weight:700;cursor:pointer;letter-spacing:1px}
.mbtn.white{background:#e8e8e8;color:#111}
.mbtn.strobe{background:#7a2020;color:#fff}
.mbtn.black{background:#000;color:#f66;border:1px solid #444}
.spacer{flex:1}
.bpm{display:flex;align-items:center;gap:8px;background:var(--panel2);padding:6px 14px;border-radius:6px;border:1px solid var(--line)}
.dot{width:12px;height:12px;border-radius:50%;background:var(--acc);box-shadow:0 0 10px var(--acc)}
.auto{padding:8px 18px;border-radius:6px;font-weight:700;background:#1c2f22;color:var(--acc);border:1px solid var(--acc)}
/* main */
.main{flex:1;display:flex;gap:10px;padding:10px;min-height:0}
/* left: PGM/PST */
.buses{width:280px;display:flex;flex-direction:column;gap:10px}
.mon{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:flex;flex-direction:column}
.mon .hd{padding:8px 12px;font-size:11px;letter-spacing:2px;font-weight:700;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}
.mon.prev .hd{color:var(--prev)} .mon.prog .hd{color:var(--prog)}
.venue{flex:1;margin:8px;border-radius:6px;background:
 repeating-linear-gradient(0deg,#0a0c0f 0 18px,#0e1216 18px 20px);position:relative;min-height:0}
.venue::after{content:'';position:absolute;inset:0;background:
 linear-gradient(90deg,transparent 24%,#2b1055 40%,#7a1f6b 55%,#e8703c 70%,#f5d76e 82%,transparent 95%);opacity:.85}
.take{display:flex;gap:8px;padding:0 8px 10px}
.take button{flex:1;padding:12px;border:none;border-radius:8px;font-weight:800;letter-spacing:1px;cursor:pointer}
.take .cut{background:#333;color:#eee}
.take .auto-take{background:linear-gradient(180deg,#e8b13c,#b98210);color:#111}
/* center: source grid */
.center{flex:1;display:flex;flex-direction:column;gap:8px;min-width:0}
.tabs{display:flex;gap:6px}
.tab{padding:7px 16px;background:var(--panel);border:1px solid var(--line);border-radius:8px 8px 0 0;color:var(--dim);cursor:pointer}
.tab.on{background:var(--panel2);color:var(--txt);border-bottom:2px solid var(--acc)}
.grid{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:0 10px 10px 10px;padding:10px;
display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));grid-auto-rows:86px;gap:8px;overflow-y:auto}
.clip{border-radius:8px;position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent}
.clip .th{position:absolute;inset:0}
.clip .nm{position:absolute;left:0;right:0;bottom:0;padding:3px 6px;background:rgba(0,0,0,.65);font-size:10px;font-weight:600}
.clip.sel{border-color:var(--prev);box-shadow:0 0 12px rgba(74,163,232,.4)}
.clip.live{border-color:var(--prog);box-shadow:0 0 12px rgba(232,177,60,.5)}
.safe{grid-column:1/-1;display:flex;gap:8px;align-items:center;background:rgba(57,217,138,.06);
border:1px dashed rgba(57,217,138,.4);border-radius:8px;padding:6px;height:64px}
.safe .lbl{writing-mode:vertical-rl;transform:rotate(180deg);font-size:9px;letter-spacing:2px;color:var(--acc);font-weight:800}
.safe .clip{width:110px;height:100%;flex:none}
/* right: looks + groups */
.right{width:250px;display:flex;flex-direction:column;gap:10px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px}
.panel h3{font-size:11px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.look{display:flex;align-items:center;gap:8px;padding:8px;background:var(--panel2);border-radius:6px;margin-bottom:6px;cursor:pointer;border-left:3px solid transparent}
.look.on{border-left-color:var(--prog);background:#232a33}
.look .sw{width:34px;height:22px;border-radius:4px}
.look .nm{flex:1;font-weight:600;font-size:12px}
.look .fd{color:var(--dim);font-size:10px}
.grp{margin-bottom:10px}
.grp .row{display:flex;justify-content:space-between;font-size:11px;margin-bottom:3px}
input[type=range]{width:100%;accent-color:var(--acc)}
</style></head><body>
<div class="master">
  <div class="logo">909&nbsp;VJ</div>
  <button class="mbtn white">WHITE</button>
  <button class="mbtn strobe">STROBE</button>
  <button class="mbtn black">BLACK</button>
  <div class="spacer"></div>
  <div class="bpm"><span class="dot"></span><b>158</b><span style="color:var(--dim)">BPM</span>
    <span style="color:var(--dim)">·</span><span>hardcore</span></div>
  <button class="auto">AUTO&nbsp;ON</button>
</div>
<div class="main">
  <div class="buses">
    <div class="mon prev"><div class="hd"><span>PREVIEW</span><span>Estallido</span></div>
      <div class="venue"></div></div>
    <div class="take"><button class="cut">CUT</button><button class="auto-take">TAKE ▸ BEAT</button></div>
    <div class="mon prog"><div class="hd"><span>PROGRAM</span><span>Flujo</span></div>
      <div class="venue" style="--x:1"></div></div>
  </div>
  <div class="center">
    <div class="tabs"><div class="tab on">DECK 1 · FX</div><div class="tab">DECK 2 · VIDEO</div><div class="tab">TEXT</div><div class="tab">MEDIA</div></div>
    <div class="grid" id="g"></div>
  </div>
  <div class="right">
    <div class="panel"><h3>LOOKS</h3>
      <div class="look on"><div class="sw" style="background:linear-gradient(90deg,#e8533c,#f5d76e)"></div><div class="nm">Sunset Fire</div><div class="fd">2.0s</div></div>
      <div class="look"><div class="sw" style="background:linear-gradient(90deg,#2b1055,#7597de)"></div><div class="nm">Deep Night</div><div class="fd">4.0s</div></div>
      <div class="look"><div class="sw" style="background:linear-gradient(90deg,#0f9b8e,#39d98a)"></div><div class="nm">Acid Wash</div><div class="fd">1.0s</div></div>
      <div class="look"><div class="sw" style="background:linear-gradient(90deg,#111,#555)"></div><div class="nm">Dark Pulse</div><div class="fd">8 beats</div></div>
      <div class="look" style="border-style:dashed;justify-content:center;color:var(--dim)">+ save look</div>
    </div>
    <div class="panel"><h3>ZONE GROUPS</h3>
      <div class="grp"><div class="row"><span>ALL</span><span>100%</span></div><input type="range" value="100"></div>
      <div class="grp"><div class="row"><span>REJAS</span><span>80%</span></div><input type="range" value="80"></div>
      <div class="grp"><div class="row"><span>CEILING</span><span>65%</span></div><input type="range" value="65"></div>
      <div class="grp"><div class="row"><span>SPEED</span><span>×1.0</span></div><input type="range" value="50"></div>
    </div>
  </div>
</div>
<script>
const g=document.getElementById('g');
const names=['Fuego','Aurora','Plasma','Espiral','Tunel','Marea','Titileo','Brasa','Corazon','Vortice','Flujo','Caleidoscopio','Goteo','Barrido','Corte','Rebote','Estallido','Lluvia','Video Wall','Banana'];
const cols=[['#e8533c','#f5d76e'],['#2b1055,#7597de'],['#0f9b8e','#39d98a'],['#7a1f6b','#e8703c'],['#141e30','#243b55'],['#e8b13c','#e8503c']];
names.forEach((n,i)=>{
  const c=document.createElement('div');c.className='clip'+(n==='Flujo'?' live':'')+(n==='Estallido'?' sel':'');
  const a=cols[i%6],b=cols[(i+1)%6];
  c.innerHTML='<div class="th" style="background:linear-gradient(120deg,'+a+','+b+')"></div><div class="nm">'+n+'</div>';
  g.appendChild(c);});
const safe=document.createElement('div');safe.className='safe';
safe.innerHTML='<div class="lbl">SAFE</div>';
['Marea','Aurora','Fuego'].forEach(n=>{const c=document.createElement('div');c.className='clip';
 c.innerHTML='<div class="th" style="background:linear-gradient(120deg,#39d98a,#7597de)"></div><div class="nm">'+n+'</div>';safe.appendChild(c);});
g.appendChild(safe);
</script></body></html>
