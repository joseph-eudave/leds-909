<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>909 VJ — Concept C: COCKPIT</title>
<style>
:root{--bg:#07080a;--glass:rgba(18,22,28,.82);--line:rgba(255,255,255,.08);--txt:#e8edf4;--dim:#8b97a5;
--acc:#3ee6a8;--prog:#ffc248;--prev:#57b1ff;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,sans-serif;user-select:none}
body{background:var(--bg);color:var(--txt);height:100vh;overflow:hidden;font-size:13px}
/* big program preview as the stage */
.stage{position:absolute;inset:0;background:
 radial-gradient(120% 90% at 30% 20%,#3a1050 0%,#14103a 35%,#07080a 75%)}
.stage::before{content:'';position:absolute;inset:0;background:
 repeating-linear-gradient(115deg,transparent 0 60px,rgba(255,120,80,.14) 60px 90px,transparent 90px 200px)}
.beam{position:absolute;width:38vw;height:120vh;background:linear-gradient(180deg,rgba(255,170,60,.35),transparent 70%);
 filter:blur(6px);transform-origin:top}
.b1{left:12%;top:-10%;transform:rotate(14deg)}
.b2{right:18%;top:-10%;transform:rotate(-18deg);background:linear-gradient(180deg,rgba(90,140,255,.3),transparent 70%)}
.pgm{position:absolute;top:18px;left:50%;transform:translateX(-50%);padding:6px 16px;border-radius:20px;
 background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);font-size:11px;letter-spacing:3px;color:var(--prog);font-weight:800}
/* left icon rail */
.rail{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:10px}
.ic{width:52px;height:52px;border-radius:14px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(8px);
 display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer;transition:.15s}
.ic.on{border-color:var(--acc);box-shadow:0 0 16px rgba(62,230,168,.25)}
.ic .bdg{position:absolute;margin:-30px 0 0 34px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* source drawer */
.drawer{position:absolute;left:82px;top:70px;bottom:110px;width:330px;background:var(--glass);border:1px solid var(--line);
 border-radius:18px;backdrop-filter:blur(14px);padding:14px;display:flex;flex-direction:column;gap:10px}
.drawer h3{font-size:11px;letter-spacing:3px;color:var(--dim)}
.dgrid{flex:1;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:74px;gap:8px;overflow-y:auto}
.dcell{border-radius:10px;position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent}
.dcell .nm{position:absolute;left:0;right:0;bottom:0;font-size:9px;padding:2px 5px;background:rgba(0,0,0,.55);font-weight:600}
.dcell.pre{border-color:var(--prev);box-shadow:0 0 12px rgba(87,177,255,.4)}
/* transport dock */
.dock{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;align-items:center;gap:12px;
 background:var(--glass);border:1px solid var(--line);border-radius:24px;backdrop-filter:blur(14px);padding:12px 20px}
.big{width:64px;height:64px;border-radius:18px;border:none;font-weight:900;font-size:11px;letter-spacing:1px;cursor:pointer}
.big.white{background:#efefef;color:#111}
.big.strobe{background:linear-gradient(180deg,#8a2626,#5c1414);color:#fff}
.big.black{background:#000;color:#f66;border:2px solid #3a3a3a}
.dock .sep{width:1px;height:44px;background:var(--line)}
.meta{text-align:center;min-width:86px}
.meta .bpm{font-size:24px;font-weight:900}
.meta .gen{font-size:10px;color:var(--dim);letter-spacing:1px}
.beatring{width:54px;height:54px;border-radius:50%;border:3px solid var(--acc);display:flex;align-items:center;justify-content:center;
 font-weight:800;box-shadow:0 0 18px rgba(62,230,168,.35)}
.auto{height:64px;padding:0 20px;border-radius:18px;background:rgba(62,230,168,.12);border:2px solid var(--acc);color:var(--acc);
 font-weight:900;letter-spacing:2px;cursor:pointer}
/* right status card */
.status{position:absolute;right:14px;top:70px;width:210px;background:var(--glass);border:1px solid var(--line);
 border-radius:16px;backdrop-filter:blur(12px);padding:12px;font-size:11px}
.status h4{font-size:10px;letter-spacing:2px;color:var(--dim);margin-bottom:8px}
.srow{display:flex;justify-content:space-between;margin-bottom:6px}
.sbar{height:6px;border-radius:3px;background:#0a0d10;overflow:hidden;margin-bottom:8px}
.sbar i{display:block;height:100%;border-radius:3px}
/* zone pills bottom right */
.zpills{position:absolute;right:14px;bottom:18px;display:flex;flex-direction:column;gap:8px}
.pill{display:flex;align-items:center;gap:8px;background:var(--glass);border:1px solid var(--line);border-radius:20px;
 padding:7px 14px;backdrop-filter:blur(10px);font-size:11px;font-weight:700;min-width:170px}
.pill .p{width:64px;height:6px;border-radius:3px;background:#0a0d10;overflow:hidden}
.pill .p i{display:block;height:100%}
</style></head><body>
<div class="stage"></div>
<div class="beam b1"></div><div class="beam b2"></div>
<div class="pgm">PROGRAM · FLUJO</div>

<div class="rail">
  <div class="ic on">🎛<span class="bdg"></span></div>
  <div class="ic">🎬</div>
  <div class="ic">🔤</div>
  <div class="ic">🧩</div>
  <div class="ic">🤖</div>
  <div class="ic">⚙</div>
</div>

<div class="drawer">
  <h3>SOURCES · DECK 1</h3>
  <div class="dgrid" id="dg"></div>
  <div style="display:flex;gap:6px">
    <div style="flex:1;text-align:center;padding:9px;border-radius:10px;background:rgba(87,177,255,.15);border:1px solid var(--prev);color:var(--prev);font-weight:800;font-size:11px">PREVIEW: Estallido</div>
    <div style="flex:1;text-align:center;padding:9px;border-radius:10px;background:rgba(255,194,72,.15);border:1px solid var(--prog);color:var(--prog);font-weight:800;font-size:11px">TAKE ▸ BEAT</div>
  </div>
</div>

<div class="dock">
  <button class="big white">WHITE</button>
  <button class="big strobe">STROBE</button>
  <button class="big black">BLACK</button>
  <div class="sep"></div>
  <div class="beatring">4/4</div>
  <div class="meta"><div class="bpm">158</div><div class="gen">HARDCORE</div></div>
  <div class="sep"></div>
  <button class="auto">AUTO<br>ON</button>
</div>

<div class="status">
  <h4>AUDIO</h4>
  <div class="srow"><span>BASS</span><span>72</span></div><div class="sbar"><i style="width:72%;background:#ff5c72"></i></div>
  <div class="srow"><span>MID</span><span>48</span></div><div class="sbar"><i style="width:48%;background:#ffc248"></i></div>
  <div class="srow"><span>HIGH</span><span>61</span></div><div class="sbar"><i style="width:61%;background:#57b1ff"></i></div>
  <h4 style="margin-top:10px">AUTO PILOT</h4>
  <div class="srow"><span>Next</span><span style="color:var(--acc)">Corte · 6 beats</span></div>
  <div class="srow"><span>Bucket</span><span>hardcore</span></div>
</div>

<div class="zpills">
  <div class="pill">ALL <div class="p"><i style="width:100%;background:#3ee6a8"></i></div>100</div>
  <div class="pill">REJAS <div class="p"><i style="width:80%;background:#57b1ff"></i></div>80</div>
  <div class="pill">CEIL <div class="p"><i style="width:64%;background:#ffc248"></i></div>64</div>
</div>
<script>
const g=document.getElementById('dg');
const N=['Fuego','Aurora','Plasma','Espiral','Tunel','Marea','Titileo','Brasa','Corazon','Vortice','Flujo','Caleid.','Goteo','Barrido','Corte','Rebote','Estall.','Lluvia'];
const C=[['#e8533c','#f5d76e'],['#2b1055','#7597de'],['#0f9b8e','#39d98a'],['#7a1f6b','#e8703c'],['#141e30','#243b55'],['#c46be8','#57b1ff']];
N.forEach((n,i)=>{const c=document.createElement('div');c.className='dcell'+(n==='Estall.'?' pre':'');
c.innerHTML='<div style="position:absolute;inset:0;background:linear-gradient(125deg,'+C[i%6][0]+','+C[i%6][1]+')"></div><div class="nm">'+n+'</div>';
g.appendChild(c);});
</script></body></html>
